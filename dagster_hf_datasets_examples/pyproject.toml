[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dagster_hf_datasets_examples"
version = "0.1.0"
description = "Dagster examples for Hugging Face datasets"
requires-python = ">=3.9"
dependencies = [
    "dagster",
    "dagster-hf-datasets",
    "datasets",
    "transformers",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
    "W191",
    "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["dagster_hf_datasets_examples"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"